name: CI

# Tests only. Never bulk data generation here — wrong tool, and against the
# spirit of the free tier (AGENTS.md §7).
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# The repo is private through M0 (D-013), so Actions minutes are metered against
# the free allowance. Cancel superseded runs and cap the job rather than letting
# a hung run quietly eat the budget (INV-9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # All three are target execution environments, which is the whole
        # reason for the matrix. Kaggle runs 3.12 (measured 3.12.13, 2026-09-14,
        # D-020) and does the bulk generation; Colab runs 3.13 (measured
        # 3.13.15) and is used interactively. 3.11 is kept as the older-bound
        # target per the stack table (spec/architecture.md §1). Code that works
        # on only one is broken.
        #
        # An earlier comment here justified the (then two-entry) matrix by
        # claiming the two resolve different sinter versions. That was wrong —
        # the 1.15/1.16 split is wheel availability, not interpreter version.
        # See AGENT_LOG (n). It also claimed Kaggle runs 3.11, which was never
        # measured and turned out to be wrong too — see D-020.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # AGENTS.md §3 requires every dependency to install without a compiler,
        # because Kaggle and Colab must install this in one cell.
        #
        # This guard used to be `--only-binary=:all:`, which was the wrong test.
        # That flag demands a *wheel*, and `sinter` 1.16.0 is sdist-only on PyPI
        # — so it silently pinned CI to `sinter` 1.15.0 while every real install
        # builds 1.16.0 from the sdist. CI was not testing what users run.
        # (This comment used to add that sinter's version enters protocol_hash.
        # It never did; sinter is installed only because ldpc depends on it.)
        #
        # Building a pure-Python sdist is fine. Invoking a C toolchain is not.
        # So: install normally, then fail if a compiler actually ran.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>&1 | tee pip-install.log
          if grep -Eiq 'x86_64-linux-gnu-gcc|(^|[[:space:]])(gcc|clang|cc1)[[:space:]]+-|Microsoft Visual C\+\+|error: command .* failed with exit' pip-install.log; then
            echo "::error::a C toolchain was invoked during install - this will not install in one cell on Kaggle or Colab"
            exit 1
          fi
          echo "no compiler invocation detected"

      - name: Record resolved versions
        # ldpc's version enters protocol_hash (INV-6) and stim's is a per-row
        # column (D-027), so a run's log has to say which ones it actually used.
        run: pip list

      - name: Run tests
        # The full suite, slow tests included. pytest.ini deselects `slow` by
        # default for local runs; this -m overrides that. CI never skips.
        run: pytest -m "slow or not slow"
