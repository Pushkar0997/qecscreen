[pytest]
testpaths = tests
pythonpath = src
# The default local run skips `slow` tests. CI overrides this with
# `-m "slow or not slow"` and runs the full suite on every leg - nothing is
# skipped there. Run everything locally with the same override.
addopts = -q --strict-markers -m "not slow"
markers =
    slow: takes more than a few seconds; excluded from the default local run, always run in CI
filterwarnings = error
